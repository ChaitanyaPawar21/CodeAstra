<!doctype html>
<meta charset="utf-8" />
<title>CodeAstra — All APIs</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0D0E14; --card:#161824; --line:#ffffff1a; --txt:#e2e8f0; --mut:#94a3b8; --acc:#6366f1; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,sans-serif; padding:32px 16px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 24px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .m { font-weight:700; font-size:11px; padding:3px 8px; border-radius:6px; }
  .GET { background:#10b98122; color:#34d399; }
  .POST { background:#6366f122; color:#818cf8; }
  .url { font-family:ui-monospace,monospace; font-size:13px; color:var(--txt); word-break:break-all; }
  .desc { color:var(--mut); font-size:12px; margin:8px 0 10px; }
  pre { background:#0b0c12; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; font-size:12px; color:#cbd5e1; margin:0; white-space:pre-wrap; word-break:break-all; }
  button { background:var(--acc); color:#fff; border:0; border-radius:7px; padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; margin-left:auto; }
  button:active { transform:scale(.96); }
  .hint { color:var(--mut); font-size:12px; margin-top:20px; }
  code { background:#ffffff14; padding:1px 5px; border-radius:4px; }
</style>
<div class="wrap">
  <h1>CodeAstra — All APIs</h1>
  <p class="sub">Click <b>Copy cURL</b>, then in Postman: <b>Import → Raw text → paste → Continue</b>.</p>
  <div id="list"></div>
  <p class="hint">Base URL assumes the backend on <code>http://localhost:5000</code>. Change the port here if yours differs.</p>
</div>
<script>
  const base = "http://localhost:5000";
  const apis = [
    { method:"GET", path:"/", desc:"Health check — returns \"Hello from server\"." },
    { method:"POST", path:"/api/analysis", desc:"Analyze a GitHub repository (cached by URL hash).",
      body:{ repoUrl:"https://github.com/facebook/react" } },
  ];

  const curl = (a) => {
    const url = base + a.path;
    if (a.method === "GET") return `curl ${url}`;
    return `curl -X ${a.method} ${url} \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(a.body)}'`;
  };

  document.getElementById("list").innerHTML = apis.map((a, i) => `
    <div class="card">
      <div class="row">
        <span class="m ${a.method}">${a.method}</span>
        <span class="url">${base}${a.path}</span>
        <button data-i="${i}">Copy cURL</button>
      </div>
      <div class="desc">${a.desc}</div>
      <pre id="c${i}">${curl(a).replace(/</g,"&lt;")}</pre>
    </div>`).join("");

  document.getElementById("list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    const text = document.getElementById("c" + btn.dataset.i).textContent;
    try { await navigator.clipboard.writeText(text); }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("c"+btn.dataset.i)); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
    const old = btn.textContent; btn.textContent = "Copied ✓";
    setTimeout(() => (btn.textContent = old), 1200);
  });
</script>
